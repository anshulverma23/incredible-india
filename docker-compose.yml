# Local / single-server environment:   docker compose up --build
# Frontend  -> http://localhost:5173      API -> http://localhost:8000/api      Swagger -> http://localhost:8000/api/docs
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host on purpose. Uncomment for a local GUI such as Compass:
    # ports: ["27017:27017"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGO_URI: mongodb://mongo:27017/india-travel
      FRONTEND_URL: http://localhost:5173
      LOG_TO_FILES: "false" # container logs go to stdout (docker logs)
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
