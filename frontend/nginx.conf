server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Where the API lives. Docker Compose service name by default; change for other setups
  # (e.g. https://your-api.onrender.com). Resolved at request time so nginx still starts if it is down.
  resolver 127.0.0.11 valid=30s;
  set $api_upstream http://backend:8000;

  # Hashed build assets never change -> cache for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Dynamic sitemap built by the API (refreshes every 10 minutes)
  location = /sitemap.xml {
    rewrite ^ /api/seo/sitemap.xml break;
    proxy_pass $api_upstream;
    proxy_ssl_server_name on;
  }

  # Public pages: the API returns this same index.html with the page's own <title>, description,
  # canonical and share tags already in the source. If the API is down, fall back to the plain app.
  location ~ ^/(hotels|packages|destinations|blog|about|faq|contact|plan-trip)(/[^/]+)?/?$ {
    set $seo_path $uri;
    proxy_pass $api_upstream/api/seo/page?path=$seo_path;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @spa;
    add_header Cache-Control "no-cache";
  }

  location @spa {
    add_header Cache-Control "no-cache";
    rewrite ^ /index.html break;
  }

  # Single-page app: unknown paths fall back to index.html (React Router handles them)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
