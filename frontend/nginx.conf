# Link-preview crawlers (WhatsApp, Facebook, X ...) do not run JavaScript, so they get the page's own
# title / description / photo from the API instead of the default index.html.
map $http_user_agent $is_share_bot {
  default 0;
  "~*(facebookexternalhit|facebot|whatsapp|twitterbot|linkedinbot|slackbot|telegrambot|pinterest|discordbot|skypeuripreview)" 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Hashed build assets never change -> cache for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Where the API lives. Docker Compose service name by default; change for other setups
  # (e.g. https://your-api.onrender.com). Resolved at request time so nginx still starts if it is down.
  resolver 127.0.0.11 valid=30s;
  set $api_upstream http://backend:8000;

  # Dynamic sitemap built by the API (refreshes every 10 minutes)
  location = /sitemap.xml {
    rewrite ^ /api/seo/sitemap.xml break;
    proxy_pass $api_upstream;
  }

  # Internal target for share-bot requests (see the if-block in `location /` below)
  location /__share/ {
    internal;
    rewrite ^/__share/(.*)$ /api/seo/share/$1 break;
    proxy_pass $api_upstream;
  }

  # Single-page app: unknown paths fall back to index.html (React Router handles them)
  location / {
    add_header Cache-Control "no-cache";
    if ($is_share_bot) {
      rewrite ^/(hotels|packages|destinations|blog)/([^/]+)/?$ /__share/$1/$2 last;
    }
    try_files $uri /index.html;
  }
}
